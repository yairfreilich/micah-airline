<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Micah Airline - SpongeBob World Tour</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #ffcc00;
            z-index: 20;
        }
        #ui h2 { margin: 0 0 5px 0; color: #ffcc00; font-size: 22px; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 20;
        }
        /* Mobile On-Screen D-Pad & Action Buttons */
        .touch-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 204, 0, 0.85);
            border: 2px solid white;
            border-radius: 50%;
            color: black;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #btn-up { bottom: 160px; left: 95px; }
        #btn-down { bottom: 30px; left: 95px; }
        #btn-left { bottom: 95px; left: 30px; }
        #btn-right { bottom: 95px; left: 160px; }

        #btn-action { right: 20px; bottom: 30px; width: 85px; height: 85px; background: rgba(0, 150, 255, 0.9); color: white; border-radius: 50%; font-size: 16px; }
        #btn-throttle { right: 120px; bottom: 30px; width: 85px; height: 85px; background: rgba(0, 255, 100, 0.9); color: black; border-radius: 50%; font-size: 16px; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>✈️ Micah Airline</h2>
        <h3 id="level-title" style="margin: 5px 0; color: #00ffcc; font-size: 18px;">Level 1: Bikini Bottom</h3>
        <div>Quest: <span id="objective">Collect all passengers and fly to the landmark!</span></div>
        <div>Mode: <span id="mode-status" style="color: #00ffcc;">WALKING ON FOOT</span></div>
        <div>Passengers: <span id="passenger-count">0</span> / <span id="passenger-target">2</span> | Level: <span id="current-lvl">1</span>/10</div>
    </div>

    <div id="controls-hint"><b>WASD/Arrows</b> to Move | <b>E</b> to Instant Enter/Exit Plane | <b>Space/Shift</b> Fly Up/Land</div>

    <!-- On-Screen Touch D-Pad for Mobile/Tablets -->
    <div class="touch-btn" id="btn-up">▲</div>
    <div class="touch-btn" id="btn-down">▼</div>
    <div class="touch-btn" id="btn-left">◄</div>
    <div class="touch-btn" id="btn-right">►</div>

    <!-- Enter/Exit & Go/Throttle Buttons -->
    <div class="touch-btn" id="btn-throttle">FLY/GO</div>
    <div class="touch-btn" id="btn-action">ENTER</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
        dirLight.position.set(200, 400, 200);
        scene.add(dirLight);

        // --- 10 CAMPAIGN LEVELS ---
        const levels = [
            { name: "Level 1: Bikini Bottom", targetName: "Eiffel Tower", groundColor: 0x2e8b57, landmarkColor: 0xff3333, count: 2 },
            { name: "Level 2: Paris", targetName: "Statue of Liberty", groundColor: 0xdcdcdc, landmarkColor: 0x2e8b57, count: 3 },
            { name: "Level 3: New York", targetName: "Big Ben", groundColor: 0x4682b4, landmarkColor: 0xffd700, count: 3 },
            { name: "Level 4: London", targetName: "Pyramids of Giza", groundColor: 0x556b2f, landmarkColor: 0x8b4513, count: 4 },
            { name: "Level 5: Egypt Desert", targetName: "Colosseum", groundColor: 0xedc9af, landmarkColor: 0xff4500, count: 4 },
            { name: "Level 6: Rome", targetName: "Taj Mahal", groundColor: 0x708090, landmarkColor: 0xffffff, count: 5 },
            { name: "Level 7: India", targetName: "Sydney Opera House", groundColor: 0x228b22, landmarkColor: 0x00ffff, count: 5 },
            { name: "Level 8: Sydney Harbour", targetName: "Mount Fuji", groundColor: 0x00008b, landmarkColor: 0xff1493, count: 6 },
            { name: "Level 9: Tokyo Snow", targetName: "Christ the Redeemer", groundColor: 0xfffafa, landmarkColor: 0x9932cc, count: 6 },
            { name: "Level 10: Rio Volcano", targetName: "Pineapple Home", groundColor: 0x8b0000, landmarkColor: 0x00ff00, count: 7 }
        ];
        let currentLevelIndex = 0;

        // --- SPONGEBOB CHARACTER MODEL ---
        const spongebob = new THREE.Group();
        const sbBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 1), new THREE.MeshLambertMaterial({ color: 0xffd700 }));
        sbBody.position.y = 1.1;
        spongebob.add(sbBody);
        const sbShirt = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 1.02), new THREE.MeshLambertMaterial({ color: 0xffffff }));
        sbShirt.position.y = 0.2;
        spongebob.add(sbShirt);
        const sbTie = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 1.05), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
        sbTie.position.set(0, 0.1, 0);
        spongebob.add(sbTie);
        const sbPants = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.02), new THREE.MeshLambertMaterial({ color: 0x8B4513 }));
        sbPants.position.y = -0.25;
        spongebob.add(sbPants);
        spongebob.position.set(0, 0, 25);
        scene.add(spongebob);

        // --- AIRPLANE MODEL ---
        const planeGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 8, 16), new THREE.MeshLambertMaterial({ color: 0xffffff }));
        body.rotation.x = Math.PI / 2;
        planeGroup.add(body);
        const wings = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 2.5), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
        planeGroup.add(wings);
        planeGroup.position.set(0, 1.5, 20);
        scene.add(planeGroup);

        // --- GROUND & SQUIDWARD BORDERS ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(2500, 2500), new THREE.MeshLambertMaterial({ color: 0x2e8b57 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const borderMat = new THREE.MeshBasicMaterial({ color: 0x40e0d0, wireframe: true, transparent: true, opacity: 0.35 });
        const borderBox = new THREE.Mesh(new THREE.BoxGeometry(2000, 400, 2000), borderMat);
        borderBox.position.set(0, 200, 0);
        scene.add(borderBox);

        for(let i = -800; i <= 800; i += 400) {
            const squidNose = new THREE.Mesh(new THREE.ConeGeometry(15, 60, 8), new THREE.MeshLambertMaterial({ color: 0x20b2aa }));
            squidNose.position.set(i, 30, -990);
            squidNose.rotation.x = Math.PI / 2;
            scene.add(squidNose);
        }

        let passengers = [];
        let landmark = null;
        let passengersCollected = 0;
        let requiredPassengers = 2;

        function loadLevel(index) {
            const lvl = levels[index];
            document.getElementById('level-title').innerText = lvl.name;
            document.getElementById('objective').innerText = `Collect all ${lvl.count} passengers and fly to ${lvl.targetName}!`;
            document.getElementById('current-lvl').innerText = index + 1;
            document.getElementById('passenger-target').innerText = lvl.count;
            document.getElementById('passenger-count').innerText = "0";
            requiredPassengers = lvl.count;
            passengersCollected = 0;

            ground.material.color.setHex(lvl.groundColor);

            passengers.forEach(p => scene.remove(p));
            passengers = [];
            if (landmark) scene.remove(landmark);

            for(let i = 0; i < lvl.count; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), new THREE.MeshLambertMaterial({ color: 0xffa500 }));
                p.position.set((Math.random() - 0.5) * 60, 1.5, -20 - (i * 15));
                scene.add(p);
                passengers.push(p);
            }

            landmark = new THREE.Mesh(new THREE.BoxGeometry(30, 150, 30), new THREE.MeshLambertMaterial({ color: lvl.landmarkColor }));
            landmark.position.set((Math.random() - 0.5) * 600, 75, -900 - (index * 75));
            scene.add(landmark);

            spongebob.position.set(0, 0, 25);
            planeGroup.position.set(0, 1.5, 20);
            isControllingPlane = false;
        }

        let isControllingPlane = false;
        let speed = 0, maxSpeed = 2.4;

        // Input Management
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE') togglePlaneMode();
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Touch button bindings for mobile / tablets
        let touchUp = false, touchDown = false, touchLeft = false, touchRight = false, touchThrottle = false;
        
        function bindTouch(id, startCallback, endCallback) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); startCallback(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); endCallback(); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); startCallback(); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); endCallback(); });
        }

        bindTouch('btn-up', () => touchUp = true, () => touchUp = false);
        bindTouch('btn-down', () => touchDown = true, () => touchDown = false);
        bindTouch('btn-left', () => touchLeft = true, () => touchLeft = false);
        bindTouch('btn-right', () => touchRight = true, () => touchRight = false);
        bindTouch('btn-throttle', () => touchThrottle = true, () => touchThrottle = false);
        document.getElementById('btn-action').addEventListener('click', togglePlaneMode);

        function togglePlaneMode() {
            if (!isControllingPlane) {
                // Instant Enter Plane!
                isControllingPlane = true;
                document.getElementById('mode-status').innerText = "FLYING AIRPLANE";
                document.getElementById('mode-status').style.color = "#ffcc00";
                document.getElementById('btn-action').innerText = "EXIT";
            } else {
                // Instant Exit Plane!
                isControllingPlane = false;
                spongebob.position.copy(planeGroup.position).add(new THREE.Vector3(3, 0, 0));
                spongebob.position.y = 0;
                document.getElementById('mode-status').innerText = "WALKING ON FOOT";
                document.getElementById('mode-status').style.color = "#00ffcc";
                document.getElementById('btn-action').innerText = "ENTER";
                speed = 0;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isControllingPlane) {
                // Airplane Controls
                if (keys['KeyW'] || keys['ArrowUp'] || touchUp || touchThrottle) speed = Math.min(speed + 0.04, maxSpeed);
                else speed = Math.max(speed - 0.015, 0);

                if (keys['KeyA'] || keys['ArrowLeft'] || touchLeft) planeGroup.rotation.y += 0.045;
                if (keys['KeyD'] || keys['ArrowRight'] || touchRight) planeGroup.rotation.y -= 0.045;

                if (keys['Space']) planeGroup.position.y += 0.35;
                else if (keys['ShiftLeft'] || keys['ShiftRight'] || touchDown) planeGroup.position.y = Math.max(planeGroup.position.y - 0.35, 1.5);

                const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), planeGroup.rotation.y);
                planeGroup.position.addScaledVector(dir, speed);
                if (planeGroup.position.y < 1.5) planeGroup.position.y = 1.5;

                spongebob.position.copy(planeGroup.position);
                spongebob.visible = false;

                const camOffset = new THREE.Vector3(0, 6, 20).applyAxisAngle(new THREE.Vector3(0, 1, 0), planeGroup.rotation.y);
                camera.position.copy(planeGroup.position).add(camOffset);
                camera.lookAt(planeGroup.position);

            } else {
                // Walking Controls
                spongebob.visible = true;
                let walkSpeed = 1.0;
                if (keys['KeyW'] || keys['ArrowUp'] || touchUp) spongebob.position.z -= walkSpeed;
                if (keys['KeyS'] || keys['ArrowDown'] || touchDown) spongebob.position.z += walkSpeed;
                if (keys['KeyA'] || keys['ArrowLeft'] || touchLeft) spongebob.position.x -= walkSpeed;
                if (keys['KeyD'] || keys['ArrowRight'] || touchRight) spongebob.position.x += walkSpeed;

                camera.position.set(spongebob.position.x, spongebob.position.y + 8, spongebob.position.z + 12);
                camera.lookAt(spongebob.position);

                // Collect passengers on foot
                passengers.forEach((p, index) => {
                    if (p && spongebob.position.distanceTo(p.position) < 5) {
                        scene.remove(p);
                        passengers[index] = null;
                        passengersCollected++;
                        document.getElementById('passenger-count').innerText = passengersCollected;
                        if (passengersCollected === requiredPassengers) {
                            alert("All passengers collected! Press E (or ENTER) to jump in your plane, take off, and fly to the landmark!");
                        }
                    }
                });
            }

            // Landmark delivery check
            if (passengersCollected >= requiredPassengers && landmark && (planeGroup.position.distanceTo(landmark.position) < 50 || spongebob.position.distanceTo(landmark.position) < 50)) {
                alert(`Mission Successful! Delivered everyone to ${levels[currentLevelIndex].targetName} via Micah Airline!`);
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    loadLevel(currentLevelIndex);
                } else {
                    alert("Incredible! You completed all 10 extreme levels of Micah Airline!");
                    currentLevelIndex = 0;
                    loadLevel(0);
                }
            }

            renderer.render(scene, camera);
        }

        loadLevel(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>a
